name: docs

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: docs and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs and offline client
        run: make check
